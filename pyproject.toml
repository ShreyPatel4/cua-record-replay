[project]
name = "cua"
version = "0.1.0"
description = "Record-once, replay-many computer-use automation for legacy back-office UIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5.0",
    "flask>=3.1.3",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "typer>=0.27.2",
]

[project.scripts]
cua = "cua.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua", "mock_app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = [
    "S101", # assert is fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["cua", "mock_app"]
known-local-folder = ["conftest", "repo_files"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"mock_app/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "mock_app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "browser: drives a real Chromium through Playwright",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20260906",
]
